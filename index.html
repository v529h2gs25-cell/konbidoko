<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コンビどこ？ | コンビニと集合場所を探す</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><header><h1>🏪 コンビどこ？</h1><p>コンビニと近くの集合スポットをセットで探そう</p></header><main><section class="controls"><label>集まる人数 <strong id="countLabel">5人</strong><input type="range" id="count" min="1" max="30" value="5"></label><label>検索範囲 <select id="radius"><option value="500">500m</option><option value="1000" selected>1km</option><option value="1500">1.5km</option></select></label><button id="locate">📍 現在地を取得</button><button id="search">🔎 この場所で探す</button><p class="hint">位置情報を許可するか、地図をタップして検索中心を選んでください。</p><p id="status" role="status">地図の読み込み中…</p></section><div id="map" aria-label="検索地図"></div><section class="results"><h2>おすすめの組み合わせ</h2><p class="hint">🟢 集合場所　🟠 コンビニ　🔵 検索中心</p><div id="results">検索すると候補が表示されます。</div></section><section class="notice"><h2>利用時の注意</h2><p>地図上の広場・公園・ベンチが、必ずしも集団での滞在を許可しているとは限りません。現地の掲示・営業時間・管理者のルールを確認し、店舗前・駐車場・歩道をふさがないでください。</p><p>初期版は直線距離による概算です。徒歩ルートや収容人数、混雑、滞在可否は検証していません。</p></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
